name: Federation Recon — Composed Digest

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # manual trigger

# Only one census may run at a time. A scheduled run and a manual dispatch used
# to be able to overlap, each pushing its own branch and opening its own pull
# request, leaving two observations of the same day racing each other to merge.
# A manual dispatch now queues behind a running scheduled census.
concurrency:
  group: node-census
  cancel-in-progress: false

permissions:
  contents: write         # needed to push the observation branch
  pull-requests: write    # the observation arrives as a pull request, not a push
  # No other permissions needed — census only reads public data via gh API

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      # The runner requires git, gh, rg and python3, and refuses to start
      # without them. ubuntu-latest ships every one of those except ripgrep, so
      # this job failed on the first line of real work on every scheduled run
      # since it was created. ci.yml and nightly-determinism.yml install it;
      # this workflow — the only one that produces a new observation — did not.
      - name: Install ripgrep (required tool per §11.1)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Run Federation Node Census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/node-census-run.sh
          bash scripts/node-census-run.sh

      - name: Run Boundary Drift Recon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/recon-run.sh
          bash scripts/recon-run.sh

      - name: Run F-02 Consumption Measurement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/consumption-run.sh
          bash scripts/consumption-run.sh

      - name: Compose Federation Digest
        run: |
          chmod +x scripts/compose-digest.sh
          bash scripts/compose-digest.sh

      - name: Strict schema validation
        run: bash scripts/validate-artifacts.sh --strict

      # The observation arrives as a pull request, not as a push.
      #
      # This step used to push straight to the default branch. The branch
      # ruleset `federation-recon-baseline` requires a pull request and has no
      # bypass actors, so that push could only ever have been rejected — which
      # nobody found out, because the job never survived long enough to reach
      # this step. Fixing only the missing tool would have moved the failure
      # from the second step to the last one.
      #
      # A pull request is also the honest shape: an observation is a claim about
      # the world, and it should pass the same required checks as any other
      # change before it becomes the repository's account of reality.
      - name: Open a pull request with the observation
        if: success() || failure()  # a partial observation is still evidence
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional. Absent, the step still opens the pull request but warns
          # loudly that it will receive no checks — a visible degradation rather
          # than a silent one.
          CENSUS_PR_TOKEN: ${{ secrets.CENSUS_PR_TOKEN }}
        run: |
          git config user.name "federation-recon[bot]"
          git config user.email "recon-bot@kimeisele.github.io"

          git add pins/ claims/ evidence/ drift/ findings/ coverage/ consumption/ digest/ STATE.md

          if git diff --cached --quiet; then
            echo "No changes to commit — the observed world matches the committed account."
            exit 0
          fi

          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="census/${DATE}-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH"
          git commit -m "federation recon composed digest ${DATE}"
          git push origin "$BRANCH"

          # The branch is pushed with GITHUB_TOKEN, but the pull request is opened
          # under a SEPARATE identity — and that distinction is the whole point.
          #
          # GitHub deliberately does not trigger workflows from events created by
          # GITHUB_TOKEN, to prevent a workflow from triggering itself. So every
          # observation opened this way received ZERO checks, while the branch
          # ruleset requires two to pass. Five observations accumulated, none
          # mergeable, and the cause looked like a policy decision rather than
          # the token-identity accident it was.
          #
          # CENSUS_PR_TOKEN carries `pull_requests: write` and NOTHING ELSE — in
          # particular no `contents` scope. It cannot push a branch, so a leak of
          # it cannot place crafted artifacts in the repository; it can only open
          # a pull request over a branch that GITHUB_TOKEN already wrote. That
          # asymmetry matters because the reproduce-fixpoint check proves the
          # artifacts follow from the pins, which an attacker controlling both
          # sides could satisfy trivially.
          if [ -n "${CENSUS_PR_TOKEN:-}" ]; then
            export GH_TOKEN="$CENSUS_PR_TOKEN"
          else
            echo "::warning::CENSUS_PR_TOKEN is not set — opening the pull request with GITHUB_TOKEN."
            echo "::warning::Workflows are NOT triggered by GITHUB_TOKEN events, so this observation"
            echo "::warning::will receive no checks and cannot satisfy the required-checks ruleset."
          fi

          gh pr create \
            --base "${GITHUB_REF_NAME:-main}" \
            --head "$BRANCH" \
            --title "observation: federation recon composed digest ${DATE}" \
            --body "Automated observation from \`node-census.yml\`, run ${GITHUB_RUN_ID}.

          Produced by \`node-census-run.sh\`, \`recon-run.sh\`, \`consumption-run.sh\`
          and \`compose-digest.sh\` in that order, then validated strictly.

          This is a machine observation and carries no judgment. The required
          checks decide whether it is internally consistent; a human decides
          whether it becomes the repository's account of the world."

      - name: Budget breach self-finding
        if: failure()
        run: |
          echo "Recon run failed — check logs for details (budget breach, partial failure, or validation error)"
          # A budget breach or validation failure is a finding per FR-CON-011
          # The runner already creates a self-Finding when possible
