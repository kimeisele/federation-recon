name: CI — artifact & digest invariants

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    env:
      CONSULTATION_PR_NUMBER: ${{ github.event.pull_request.number }}
      # The pin validation gate compares each pinned commit against its ref on
      # the observed repository, which needs an authenticated gh. Without this
      # the gate correctly reported UNKNOWN for every pin and failed the run —
      # the right behaviour and the wrong cause. The observed repositories are
      # public, so the repository-scoped token suffices to read them.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: CI checks (strict validation + composed-digest idempotency)
        run: bash scripts/ci-checks.sh

  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history. check_consultation_rounds proves that a superseded
          # review round was never deleted, and it proves it from git history
          # — which a shallow clone does not have. It fails rather than
          # skipping, so a depth-1 checkout turns it into a permanent red
          # instead of a silent green. That is the right direction and this is
          # the other half of it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install bats-core and ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats ripgrep

      # scripts/test/suite-inventory.bats needs a locale in which two distinct
      # names are not ordered — `ß` and `ss` under de_DE. Without it the test
      # falls back to C, where every pair of distinct names *is* ordered, and
      # the guard it exists to prove goes unexercised. That test fails rather
      # than skips when the locale is missing, so this step is load-bearing.
      - name: Generate de_DE.UTF-8 (collation fixture for suite-inventory)
        run: |
          sudo apt-get install -y -qq locales
          sudo locale-gen de_DE.UTF-8

      - name: Run offline test suite
        run: bats scripts/test/

  # Pull-request only: a feature PR must commit a reproduce FIXPOINT — the
  # committed artifacts must equal a fresh --reproduce. This catches PRs that
  # add/extend a procedure but commit a stale artifact set (code produces more
  # than was committed), which the offline gate and reproduce-stability nightly
  # cannot see. Not run on push to main, where the daily census legitimately
  # commits a fresh live observation.
  reproduce-fixpoint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Reproduce from committed pins
        run: |
          RECON_PINS_DIR=pins bash scripts/recon-run.sh --reproduce
          RECON_PINS_DIR=pins bash scripts/node-census-run.sh --reproduce
          RECON_PINS_DIR=pins bash scripts/consumption-run.sh --reproduce
          bash scripts/compose-digest.sh

      - name: Assert committed artifacts equal the reproduce fixpoint
        run: |
          if ! git diff --quiet -- pins claims evidence drift findings coverage consumption digest STATE.md; then
            echo "::error::Committed artifacts are stale — a fresh --reproduce differs. Regenerate the fixpoint and commit it."
            git --no-pager diff --stat -- pins claims evidence drift findings coverage consumption digest STATE.md
            exit 1
          fi
          echo "OK: committed artifacts are a reproduce fixpoint"
